<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handbook Q&amp;A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFF2F1;
    --ink:#16211F;
    --muted:#5A6A66;
    --rule:#C9D2CF;
    --deep:#1F4A43;
    --mark:#F2D544;
    --serif:"Newsreader",Georgia,serif;
    --sans:"IBM Plex Sans",system-ui,sans-serif;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:40px 24px 96px}

  header{border-bottom:1px solid var(--rule);padding-bottom:28px;margin-bottom:32px}
  h1{
    font-family:var(--serif);font-weight:300;font-size:clamp(32px,6vw,52px);
    letter-spacing:-.02em;margin:0 0 8px;
  }
  header p{margin:0;color:var(--muted);max-width:58ch}

  form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  input[type=text]{
    flex:1 1 320px;min-width:0;padding:14px 16px;font:inherit;color:var(--ink);
    background:#fff;border:1px solid var(--rule);border-radius:2px;
  }
  input[type=text]:focus-visible,button:focus-visible,select:focus-visible,
  .cite:focus-visible,summary:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
  button.ask{
    padding:14px 24px;font:inherit;font-weight:600;color:#fff;background:var(--deep);
    border:none;border-radius:2px;cursor:pointer;
  }
  button.ask:disabled{opacity:.5;cursor:progress}
  .controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;
    color:var(--muted);font-size:14px;margin-bottom:8px}
  select{font:inherit;padding:6px 8px;background:#fff;border:1px solid var(--rule);
    border-radius:2px;color:var(--ink)}

  .samples{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:36px}
  .samples button{
    font:inherit;font-size:13px;color:var(--muted);background:transparent;
    border:1px solid var(--rule);border-radius:999px;padding:5px 12px;cursor:pointer;
  }
  .samples button:hover{border-color:var(--deep);color:var(--deep)}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
  @media (max-width:860px){.layout{grid-template-columns:1fr;gap:28px}}

  .answer{
    font-family:var(--serif);font-size:19px;line-height:1.65;
    white-space:pre-wrap;max-width:62ch;
  }
  .answer.refused{font-family:var(--sans);font-size:16px;color:var(--muted);
    border-left:3px solid var(--rule);padding-left:16px}

  .cite{
    font-family:var(--sans);font-size:12px;font-weight:600;vertical-align:.35em;
    background:var(--mark);color:var(--ink);border:none;border-radius:2px;
    padding:1px 5px;margin:0 1px;cursor:pointer;
  }

  aside h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 14px;
    letter-spacing:.02em}
  .passage{border-top:1px solid var(--rule);padding:14px 0}
  .passage:last-of-type{border-bottom:1px solid var(--rule)}
  .passage .meta{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
  .passage .num{
    font-size:12px;font-weight:600;background:var(--mark);padding:1px 6px;border-radius:2px;
  }
  .passage .where{font-size:13px;font-weight:500}
  .passage .dist{font-size:12px;color:var(--muted);margin-left:auto}
  .passage .sect{font-size:12px;color:var(--muted);margin-bottom:6px}
  .passage .text{font-family:var(--serif);font-size:15px;line-height:1.55;
    color:#2A3936;max-height:7.5em;overflow:hidden;position:relative}
  .passage .text.open{max-height:none}
  .passage .more{font-size:12px;color:var(--deep);background:none;border:none;
    padding:4px 0;cursor:pointer;font-family:var(--sans)}
  .passage.flash{animation:flash 1.1s ease-out}
  @keyframes flash{from{background:var(--mark)}to{background:transparent}}
  @media (prefers-reduced-motion:reduce){.passage.flash{animation:none;outline:2px solid var(--mark)}}

  details{margin-top:24px;font-size:13px;color:var(--muted)}
  details .passage .num{background:var(--rule)}
  summary{cursor:pointer}
  .status{color:var(--muted);font-family:var(--sans);font-size:15px}
  .error{color:#7A2B22;border-left:3px solid #7A2B22;padding-left:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ask the handbook</h1>
    <p>Answers are built only from passages retrieved out of the indexed PDFs. Every claim is numbered; tap a number to read the passage it came from.</p>
  </header>

  <form id="form">
    <input id="q" type="text" autocomplete="off" placeholder="How many days of paid time off do employees get?" aria-label="Your question">
    <button class="ask" id="submit" type="submit">Ask</button>
  </form>

  <div class="controls">
    <label>Chunking
      <select id="strategy">
        <option value="section">section aware</option>
        <option value="recursive">fixed size</option>
      </select>
    </label>
    <span id="gate"></span>
  </div>

  <div class="samples" id="samples"></div>

  <div class="layout">
    <main>
      <div class="answer status" id="answer">Ask a question to begin.</div>
    </main>
    <aside>
      <h2 id="evidence-title"></h2>
      <div id="sources"></div>
      <details id="rejected-wrap" hidden>
        <summary id="rejected-summary"></summary>
        <div id="rejected"></div>
      </details>
    </aside>
  </div>
</div>

<script>
const SAMPLES = [
  "How many days of paid time off do employees receive?",
  "What is the notice period for resignation?",
  "How do I report harassment?",
  "What is the company's policy on Mars colonisation?"
];

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("samples").innerHTML = SAMPLES.map(s =>
  `<button type="button" data-q="${esc(s)}">${esc(s)}</button>`).join("");
$("samples").addEventListener("click", e => {
  const q = e.target.dataset.q;
  if (q) { $("q").value = q; $("form").requestSubmit(); }
});

fetch("/health").then(r => r.json()).then(h => {
  $("strategy").value = h.default_strategy;
  $("gate").textContent = `top ${h.k} passages · relevance cut-off ${h.threshold}`;
}).catch(() => {});

function renderAnswer(text) {
  // Turn [1] and [2][3] markers into buttons that jump to the passage.
  return esc(text).replace(/\[(\d+)\]/g, (_, n) =>
    `<button class="cite" data-n="${n}" title="Show passage ${n}">${n}</button>`);
}

function passageHTML(s, dim) {
  const where = `${esc(s.source)} · page ${esc(String(s.pages))}`;
  return `<div class="passage" id="${dim ? "rej" : "src"}-${s.rank}">
    <div class="meta">
      <span class="num">${s.rank}</span>
      <span class="where">${where}</span>
      <span class="dist">${s.distance}</span>
    </div>
    ${s.section ? `<div class="sect">${esc(s.section)}</div>` : ""}
    <div class="text">${esc(s.text)}</div>
    <button class="more" type="button">Show full passage</button>
  </div>`;
}

document.addEventListener("click", e => {
  if (e.target.classList.contains("more")) {
    const body = e.target.previousElementSibling;
    body.classList.toggle("open");
    e.target.textContent = body.classList.contains("open") ? "Collapse" : "Show full passage";
  }
  if (e.target.classList.contains("cite")) {
    const el = $("src-" + e.target.dataset.n);
    if (el) {
      el.scrollIntoView({behavior: "smooth", block: "center"});
      el.classList.remove("flash");
      void el.offsetWidth;
      el.classList.add("flash");
    }
  }
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question) return;

  $("submit").disabled = true;
  $("answer").className = "answer status";
  $("answer").textContent = "Searching the documents…";
  $("sources").innerHTML = "";
  $("evidence-title").textContent = "";
  $("rejected-wrap").hidden = true;

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question, strategy: $("strategy").value})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Request failed");

    $("answer").className = "answer" + (data.refused ? " refused" : "");
    $("answer").innerHTML = renderAnswer(data.answer);

    if (data.sources.length) {
      $("evidence-title").textContent =
        `${data.sources.length} passage${data.sources.length > 1 ? "s" : ""} used`;
      $("sources").innerHTML = data.sources.map(s => passageHTML(s, false)).join("");
    } else {
      const closest = data.considered.length ? data.considered[0].distance : "—";
      $("evidence-title").textContent = "No passage was close enough";
      $("sources").innerHTML =
        `<p class="status">Closest match scored ${closest}, past the cut-off of ${data.threshold}.</p>`;
    }

    const rejected = data.considered.filter(c => c.distance > data.threshold);
    if (rejected.length) {
      $("rejected-wrap").hidden = false;
      $("rejected-summary").textContent =
        `${rejected.length} retrieved but rejected as too distant`;
      $("rejected").innerHTML = rejected.map(s => passageHTML(s, true)).join("");
    }
  } catch (err) {
    $("answer").className = "answer error";
    $("answer").textContent = err.message +
      " — check the server is running and the indexes are built.";
  } finally {
    $("submit").disabled = false;
  }
});
</script>
</body>
</html>
